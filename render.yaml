services:
  # Despliegue como Static Site en Render para https://rrhh-simple.onrender.com
  - type: web
    name: rrhh-simple
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

  - type: web
    name: rrhh-backend
    env: docker
    dockerfilePath: server/Dockerfile
    branch: psinza-roles-y-permisos
    plan: free
    envVars:
      - key: PORT
        value: "4000"
