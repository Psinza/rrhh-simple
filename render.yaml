services:
  - type: web_service
    name: rrhh-simple
    env: node
    plan: free
    repo: "https://github.com/Psinza/rrhh-simple"
    branch: main
    buildCommand: "npm ci && npm ci --prefix server --omit=dev && npm run build"
    startCommand: "node server/index.js"
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: SERVE_STATIC
        value: "true"
      - key: JWT_SECRET
        value: "__REPLACE_WITH_SECRET__"
      - key: ALLOWED_ORIGIN
        value: "https://rrhh-simple.onrender.com"
    healthCheckPath: /health
    pullRequestPreviewsEnabled: false
